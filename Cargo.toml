[workspace]
members = ["crates/tooling/extensions-xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/extensions"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "=0.33.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
